---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025 The Linux Foundation

# Action test/validation workflow
name: 'Test GitHub Action 🧪'

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
    paths:
      - '**'
      - '!.github/**'
      - '!.*'
      - '!tox.ini'

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  ### Test the GitHub Action in this Repository ###
  tests:
    name: 'Action Testing'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 2
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Perform setup prior to running test(s)
      - name: 'Checkout sample project repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: 'lfreleng-actions/test-python-project'
          path: 'test-python-project'

      - name: 'Check for test-python-project directory'
        id: test-python-project
        uses: ./
        with:
          path: 'test-python-project'

      - name: 'Check for pyproject.toml file'
        id: pyproject-toml
        uses: ./
        with:
          path: 'test-python-project/pyproject.toml'

      - name: 'Check for LICENSE symlink'
        id: license-symlink
        uses: ./
        with:
          path: 'test-python-project/LICENSE'

      - name: 'Check: error when path not supplied'
        id: no-path
        uses: ./
        continue-on-error: true
        with:
          path: ''
          # Note: action supplied an empty path
          # We subsequently test that this step fails

      - name: 'Validate previous step failure'
        if: steps.no-path.outcome == 'success'
        shell: bash
        run: |
          # Check previous step failure
          echo "Error: previous step should have failed ❌"
          exit 1

      - name: "Validate Action Output: ${{ github.repository }}"
        shell: bash
        run: |
          # Validate Action Output
          if [ "${STEPS_TEST_PYTHON_PROJECT_OUTPUTS_TYPE}" \
            != 'directory' ]; then
            echo "Unexpected return value for: test-python-project ❌"
            echo "Returned: ${STEPS_TEST_PYTHON_PROJECT_OUTPUTS_TYPE}"
            echo 'Expected: directory'
            ERROR='true'
          fi
          if [ "${STEPS_TEST_PYTHON_PROJECT_OUTPUTS_EXISTS}" \
            != 'true' ]; then
            echo "Unexpected return value for: test-python-project exists ❌"
            echo "Returned: ${STEPS_TEST_PYTHON_PROJECT_OUTPUTS_EXISTS}"
            echo 'Expected: true'
            ERROR='true'
          fi
          if [ "${STEPS_PYPROJECT_TOML_OUTPUTS_TYPE}" \
            != 'file' ]; then
            echo "Unexpected return value for: pyproject.toml ❌"
            echo "Returned: ${STEPS_PYPROJECT_TOML_OUTPUTS_TYPE}"
            echo 'Expected: file'
            ERROR='true'
          fi
          if [ "${STEPS_PYPROJECT_TOML_OUTPUTS_EXISTS}" \
            != 'true' ]; then
            echo "Unexpected return value for: pyproject.toml exists ❌"
            echo "Returned: ${STEPS_PYPROJECT_TOML_OUTPUTS_EXISTS}"
            echo 'Expected: true'
            ERROR='true'
          fi
          if [ "${STEPS_LICENSE_SYMLINK_OUTPUTS_TYPE}" \
            != 'file' ]; then
            echo "Unexpected return value for: LICENSE ❌"
            echo "Returned: ${STEPS_LICENSE_SYMLINK_OUTPUTS_TYPE}"
            echo 'Expected: file'
            ERROR='true'
          fi
          if [ "${STEPS_LICENSE_SYMLINK_OUTPUTS_SYMLINK}" \
            != 'true' ]; then
            echo "Unexpected return value for: LICENSE ❌"
            echo "Returned: ${STEPS_LICENSE_SYMLINK_OUTPUTS_SYMLINK}"
            echo 'Expected: true'
            ERROR='true'
          fi
          if [ "${STEPS_LICENSE_SYMLINK_OUTPUTS_EXISTS}" \
            != 'true' ]; then
            echo "Unexpected return value for: LICENSE exists ❌"
            echo "Returned: ${STEPS_LICENSE_SYMLINK_OUTPUTS_EXISTS}"
            echo 'Expected: true'
            ERROR='true'
          fi
          if [ "$ERROR" != 'true' ]; then
            echo "All output tests passed ✅"
          else
            echo "At least one output test failed ❌"
            exit 1
          fi
        env:
          # yamllint disable-line rule:line-length
          STEPS_TEST_PYTHON_PROJECT_OUTPUTS_TYPE: ${{ steps.test-python-project.outputs.type }}
          # yamllint disable-line rule:line-length
          STEPS_TEST_PYTHON_PROJECT_OUTPUTS_EXISTS: ${{ steps.test-python-project.outputs.exists }}
          # yamllint disable-line rule:line-length
          STEPS_PYPROJECT_TOML_OUTPUTS_TYPE: ${{ steps.pyproject-toml.outputs.type }}
          # yamllint disable-line rule:line-length
          STEPS_PYPROJECT_TOML_OUTPUTS_EXISTS: ${{ steps.pyproject-toml.outputs.exists }}
          # yamllint disable-line rule:line-length
          STEPS_LICENSE_SYMLINK_OUTPUTS_TYPE: ${{ steps.license-symlink.outputs.type }}
          # yamllint disable-line rule:line-length
          STEPS_LICENSE_SYMLINK_OUTPUTS_SYMLINK: ${{ steps.license-symlink.outputs.symlink }}
          # yamllint disable-line rule:line-length
          STEPS_LICENSE_SYMLINK_OUTPUTS_EXISTS: ${{ steps.license-symlink.outputs.exists }}
